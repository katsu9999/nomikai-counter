<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14100c">
<title>GG グビロワイヤル</title>
<style>
  :root {
    --bg: #14100c;
    --card: #241c14;
    --card-tap: #3a2c1c;
    --amber: #d99a2b;
    --amber-dim: #8a6320;
    --text: #f2e8d8;
    --sub: #a89878;
    --line: #3c3020;
    --danger: #c05040;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, .person, .addCard, .eqToggle, .drinkTabs button { touch-action: manipulation; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    min-height: 100vh; padding: 16px; user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; color: var(--amber); white-space: nowrap; }
  .drinkTabs { display: flex; gap: 6px; }
  .drinkTabs button {
    font-size: 18px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--sub); cursor: pointer;
  }
  .drinkTabs button.active { background: var(--amber); color: #1a1408; border-color: var(--amber); font-weight: bold; }
  .bottle { flex: 1; min-width: 200px; }
  .bottle .label { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; margin-bottom: 3px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--amber); border-radius: 5px; transition: width .3s; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .person {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 16px; cursor: pointer; text-align: center; position: relative;
    transition: background .1s, transform .05s;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  .half { font-size: 15px; color: var(--sub); vertical-align: middle; }
  .hint { font-size: 13px; color: var(--sub); margin: -6px 0 12px; }
  .ranking {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 14px; position: relative; overflow: hidden;
    animation: rankGlow 2.4s ease-in-out infinite;
  }
  @keyframes rankGlow {
    0%, 100% { box-shadow: 0 0 6px 0 rgba(217, 154, 43, .2); border-color: var(--line); }
    50% { box-shadow: 0 0 22px 4px rgba(217, 154, 43, .55); border-color: var(--amber); }
  }
  .tw { position: absolute; font-size: 16px; pointer-events: none; animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .1; transform: scale(.6) rotate(0); }
    50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
  }
  .ranking:empty { display: none; }
  .rankHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; color: var(--amber); font-weight: bold; }
  .trash {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 16px; margin-bottom: 14px; font-size: 15px;
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  .trash:empty { display: none; }
  .trash .tTitle { color: var(--amber); font-weight: bold; font-size: 14px; }
  .trash .pile { font-size: 22px; word-break: break-all; }
  .trash .pile span { display: inline-block; }
  .trash .cCan { transform: scaleY(.6) rotate(-11deg); filter: saturate(.75) brightness(.85); }
  .trash .pile span:nth-child(even).cCan { transform: scaleY(.62) rotate(10deg); }
  .trash .cBottle { transform: rotate(102deg); filter: brightness(.85); }
  .trash .pile span:nth-child(even).cBottle { transform: rotate(78deg) scaleY(.95); }
  .trash .cPet { transform: rotate(-16deg); opacity: .85; }
  .trash .pile span:nth-child(even).cPet { transform: rotate(15deg) scaleY(.9); }
  .trash .tN { color: var(--sub); font-size: 13px; margin-left: -8px; }
  .rankRow { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .rMedal { width: 34px; text-align: center; }
  .rName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32%; }
  .rBarWrap { flex: 1; background: var(--line); border-radius: 7px; overflow: hidden; }
  .rBar { background: var(--amber); border-radius: 7px; transition: width .3s; }
  .rVal { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .r0 .rMedal { font-size: 30px; }
  .r0 .rName { font-size: 26px; font-weight: bold; color: var(--amber); animation: nameGlow 1.8s ease-in-out infinite; }
  @keyframes nameGlow {
    0%, 100% { text-shadow: 0 0 8px rgba(240, 184, 64, .5); }
    50% { text-shadow: 0 0 22px rgba(255, 224, 138, 1); }
  }
  .r0 .rBar {
    height: 18px;
    background: linear-gradient(90deg, var(--amber), #f0b840, #ffe08a, #f0b840, var(--amber));
    background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }
  .r0 .rVal { font-size: 16px; font-weight: bold; color: var(--text); }
  .r1 .rMedal { font-size: 21px; }
  .r1 .rName { font-size: 18px; }
  .r1 .rBar { height: 12px; }
  .r2 .rMedal { font-size: 17px; }
  .r2 .rName { font-size: 15px; color: var(--sub); }
  .r2 .rBar { height: 8px; background: var(--amber-dim); }
  .eqToggle {
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
    font-size: 13px; color: var(--sub); cursor: pointer; background: var(--bg); font-weight: normal;
  }
  .person:active { background: var(--card-tap); transform: scale(0.97); }
  .person .name { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
  .person .count { font-size: 44px; font-weight: bold; color: var(--amber); line-height: 1.1; }
  .person .count .cupsUnit { font-size: 17px; color: var(--sub); margin-left: 4px; font-weight: normal; }
  .person .gN { font-size: 13px; color: var(--sub); }
  .person .detail { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .person .glasses { margin-top: 8px; font-size: 21px; line-height: 1.35; word-break: break-all; min-height: 28px; }
  .person .kcal { margin-top: 4px; font-size: 13px; color: var(--amber); }
  .person .alc { margin-top: 8px; font-size: 13px; }
  .alc.t1 { color: var(--sub); }
  .alc.t2 { color: var(--amber); }
  .alc.t3 { color: #e0762e; font-weight: bold; }
  .alc.t4 { color: var(--danger); font-weight: bold; }
  .person .del {
    position: absolute; top: 8px; right: 10px; color: var(--sub); font-size: 14px;
    padding: 4px 8px; opacity: .5;
  }
  .addCard {
    border: 2px dashed var(--line); border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 17px; color: var(--sub); padding: 18px; cursor: pointer; min-height: 130px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar button {
    padding: 12px 16px; font-size: 15px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  .toolbar button.warn { color: var(--danger); border-color: var(--danger); }

  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  section h2 { font-size: 15px; color: var(--amber); margin-bottom: 10px; }
  .commentRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .commentRow input {
    flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  .commentRow button { padding: 12px 18px; border-radius: 8px; border: none; background: var(--amber); color: #1a1408; font-weight: bold; font-size: 15px; cursor: pointer; }
  .log { list-style: none; font-size: 14px; color: var(--sub); max-height: 180px; overflow-y: auto; }
  .log li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log li b { color: var(--text); }
  .setRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 15px; }
  .setRow input {
    width: 90px; padding: 8px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); text-align: right;
  }
  .historyItem { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  .historyItem .sum { font-size: 13px; color: var(--sub); margin-top: 3px; }
  .hidden { display: none; }
  .person.aqua { animation: aquaGlow 2s ease-in-out infinite; }
  @keyframes aquaGlow {
    0%, 100% { box-shadow: 0 0 6px 0 rgba(126, 196, 232, .3); }
    50% { box-shadow: 0 0 20px 4px rgba(126, 196, 232, .8); border-color: #7ec4e8; }
  }
  .toast.aquaToast { background: #7ec4e8; color: #0c2430; }
  @keyframes pulseWarn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224, 118, 46, 0); }
    50% { box-shadow: 0 0 16px 3px rgba(224, 118, 46, .7); border-color: #e0762e; }
  }
  .person.warn3 { animation: pulseWarn 1.6s infinite; }
  @keyframes pulseDanger {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 80, 64, 0); }
    50% { box-shadow: 0 0 22px 6px rgba(192, 80, 64, .9); border-color: var(--danger); }
  }
  .person.warn4 { animation: pulseDanger 0.9s infinite; }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: #e0762e; color: #fff; font-weight: bold; font-size: 16px;
    padding: 12px 22px; border-radius: 12px; z-index: 100; white-space: nowrap;
    animation: toastIn 3.5s forwards;
  }
  .toast.t4toast { background: var(--danger); }
  .toast.goldToast { background: var(--amber); color: #1a1408; }
  .confetti {
    position: fixed; top: -14px; width: 10px; height: 14px; border-radius: 2px;
    z-index: 98; pointer-events: none; animation: confFall linear forwards;
  }
  @keyframes confFall { to { transform: translateY(108vh) rotate(720deg); opacity: .8; } }
  .cracker { position: fixed; top: 16%; font-size: 64px; z-index: 98; pointer-events: none; animation: crackerPop 1.5s ease-out forwards; }
  @keyframes crackerPop {
    0% { transform: scale(0.3); opacity: 0; }
    20% { transform: scale(1.5); opacity: 1; }
    60% { transform: scale(1); }
    100% { opacity: 0; }
  }
  .cut { position: fixed; inset: 0; z-index: 95; pointer-events: none; background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,.5)); animation: cutFade 1.4s forwards; }
  @keyframes cutFade { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
  .cutBall { position: absolute; top: 28%; left: -10%; font-size: 72px; animation: ballFly 1.1s ease-in forwards; }
  @keyframes ballFly {
    0% { left: -10%; transform: translateY(0) rotate(0); }
    50% { transform: translateY(-90px) rotate(360deg); }
    100% { left: 105%; transform: translateY(12px) rotate(900deg); }
  }
  .cutText {
    position: absolute; top: 44%; left: 50%; font-size: min(64px, 9vw); font-weight: 900; font-style: italic;
    color: #fff; text-shadow: 0 0 26px var(--amber), 0 4px 0 #7a5510; white-space: nowrap;
    animation: slam 1.4s cubic-bezier(.2, 1.4, .4, 1) forwards;
  }
  @keyframes slam {
    0% { transform: translate(-50%, -50%) scale(3) rotate(-6deg); opacity: 0; }
    18% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.08) rotate(-3deg); opacity: 0; }
  }
  .cutIcon { position: absolute; top: 66%; left: 50%; transform: translateX(-50%); font-size: 96px; animation: crackerPop 1.4s ease-out forwards; }
  .hype {
    position: fixed; z-index: 97; font-weight: 900; font-size: 38px; color: var(--amber);
    text-shadow: 0 2px 12px rgba(0,0,0,.6); pointer-events: none; white-space: nowrap;
    animation: hypePop 1.1s ease-out forwards;
  }
  @keyframes hypePop {
    0% { transform: scale(.3) rotate(var(--rot)); opacity: 0; }
    25% { transform: scale(1.25) rotate(var(--rot)); opacity: 1; }
    70% { transform: scale(1) rotate(var(--rot)); }
    100% { transform: scale(1) rotate(var(--rot)) translateY(-34px); opacity: 0; }
  }
  @keyframes shake {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(3px, -2px); }
    50% { transform: translate(-3px, 2px); }
    75% { transform: translate(2px, 1px); }
  }
  body.shake { animation: shake .18s; }
  .spark { position: fixed; font-size: 20px; z-index: 97; pointer-events: none; animation: sparkFly .8s ease-out forwards; }
  @keyframes sparkFly { to { transform: translate(var(--dx), var(--dy)) scale(0.4); opacity: 0; } }
  .gulp { position: fixed; font-size: 46px; z-index: 98; pointer-events: none; animation: gulp 1s ease-in-out forwards; }
  @keyframes gulp {
    0% { transform: rotate(0) scale(1); opacity: 1; }
    25% { transform: rotate(-45deg) scale(1.25); }
    50% { transform: rotate(0) scale(1); }
    75% { transform: rotate(-45deg) scale(1.25); }
    100% { transform: rotate(0) scale(0.9); opacity: 0; }
  }
  @keyframes toastIn {
    0% { opacity: 0; transform: translate(-50%, -20px); }
    10%, 80% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; }
  }
  .pop {
    position: fixed; pointer-events: none; font-size: 26px; font-weight: bold; color: var(--amber);
    animation: rise .7s ease-out forwards; z-index: 99;
  }
  @keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }

  /* iPad Pro 12.9" など大画面向け */
  @media (min-width: 1024px) {
    body { padding: 24px 32px; }
    h1 { font-size: 26px; }
    .drinkTabs button { font-size: 22px; padding: 12px 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .person { padding: 24px 20px; }
    .person .name { font-size: 28px; }
    .person .count { font-size: 64px; }
    .person .glasses { font-size: 26px; }
    .person .alc, .person .kcal, .person .gN { font-size: 15px; }
    .addCard { font-size: 20px; min-height: 180px; }
    .toolbar button { font-size: 17px; padding: 16px 22px; }
    .r0 .rName { font-size: 34px; }
    .r0 .rMedal { font-size: 38px; }
    .r0 .rBar { height: 24px; }
    .r1 .rName { font-size: 22px; }
    .r1 .rBar { height: 15px; }
    .r2 .rName { font-size: 18px; }
    .rVal, .r0 .rVal { font-size: 17px; }
    .hint { font-size: 15px; }
  }
</style>
</head>
<body>

<header>
  <h1 id="appTitle">🍻 GG グビロワイヤル</h1>
  <button class="eqToggle" id="langBtn" onclick="toggleLang()">EN</button>
  <div class="drinkTabs" id="drinkTabs"></div>
  <div class="bottle" id="bottleWrap">
    <div class="label"><span id="bottleLabel">ニッカ残量</span><span id="bottleText"></span></div>
    <div class="bar"><div id="bottleBar"></div></div>
  </div>
</header>

<div class="ranking" id="ranking"></div>

<div class="trash" id="trash"></div>

<div class="grid" id="grid"></div>

<div class="hint" id="hintBar">💡 タップ＝1杯　長押し（0.5秒）＝半杯½</div>

<div class="toolbar">
  <button id="btnUndo" onclick="undo()">↩︎ 1つ戻す</button>
  <button id="btnComment" onclick="SFX.click();toggle('commentSec')">💬 コメント</button>
  <button id="btnHistory" onclick="SFX.click();toggle('historySec'); renderHistory()">📜 過去の会</button>
  <button id="btnExport" onclick="SFX.click();exportJSON()">⬇️ JSON保存</button>
  <button id="btnImport" onclick="SFX.click();importJSON()">⬆️ 読み込み</button>
  <button id="btnSettings" onclick="SFX.click();toggle('settingsSec')">⚙️ 設定</button>
  <button class="warn" id="btnEnd" onclick="endSession()">🏁 今日の会を締める</button>
</div>

<section id="settingsSec" class="hidden">
  <h2 id="settingsTitle">⚙️ マスタ設定（後から変更OK）</h2>
  <div id="settingsRows"></div>
</section>

<section id="commentSec" class="hidden">
  <h2 id="commentTitle">💬 今日のコメント</h2>
  <div class="commentRow">
    <input id="commentInput" placeholder="例：田中、ペース早すぎ笑">
    <button id="btnAddComment" onclick="addComment()">追加</button>
  </div>
  <ul class="log" id="commentLog"></ul>
</section>

<section id="historySec" class="hidden">
  <h2 id="historyTitle">📜 過去の会</h2>
  <div id="historyList"></div>
</section>

<section>
  <h2 id="logTitle">📋 今日のログ</h2>
  <ul class="log" id="eventLog"></ul>
</section>

<input type="file" id="fileInput" accept=".json" class="hidden">

<script>
const DRINKS = {
  whisky: { icon: '🥃', label: 'ウイスキー', en: 'Whisky',   cupMl: 30 },
  wine:   { icon: '🍷', label: 'ワイン',     en: 'Wine',     cupMl: null },
  beer:   { icon: '🍺', label: 'ビール',     en: 'Beer',     cupMl: null },
  cocktail: { icon: '🍹', label: 'カクテル', en: 'Cocktail', cupMl: null },
  water:    { icon: '💧', label: 'チェイサー', en: 'Chaser',  cupMl: null },
};
// ---- 日英辞書 ----
const lang = () => (store.settings && store.settings.lang) || 'ja';
const L = {
  appTitle: { ja: '🍻 GG グビロワイヤル', en: '🍻 GG Gubi Royale' },
  bottleLabel: { ja: 'ニッカ残量', en: 'Nikka left' },
  hintBar: { ja: '💡 タップ＝1杯　長押し（0.5秒）＝半杯½', en: '💡 Tap = 1 drink / long-press (0.5s) = half ½' },
  btnUndo: { ja: '↩︎ 1つ戻す', en: '↩︎ Undo' },
  btnComment: { ja: '💬 コメント', en: '💬 Comments' },
  btnHistory: { ja: '📜 過去の会', en: '📜 History' },
  btnExport: { ja: '⬇️ JSON保存', en: '⬇️ Save JSON' },
  btnImport: { ja: '⬆️ 読み込み', en: '⬆️ Load' },
  btnSettings: { ja: '⚙️ 設定', en: '⚙️ Settings' },
  btnEnd: { ja: '🏁 今日の会を締める', en: '🏁 End session' },
  commentTitle: { ja: '💬 今日のコメント', en: '💬 Tonight\'s comments' },
  btnAddComment: { ja: '追加', en: 'Add' },
  commentPh: { ja: '例：田中、ペース早すぎ笑', en: 'e.g. Tanaka is way too fast lol' },
  historyTitle: { ja: '📜 過去の会', en: '📜 Past sessions' },
  logTitle: { ja: '📋 今日のログ', en: '📋 Tonight\'s log' },
  settingsTitle: { ja: '⚙️ マスタ設定（後から変更OK）', en: '⚙️ Settings (editable anytime)' },
  rankTitle: { ja: '🏆 本日の酔王ランキング', en: '🏆 Tonight\'s Drink Kings' },
  addCard: { ja: '＋ 参加者を追加', en: '+ Add player' },
  cupsUnit: { ja: '杯', en: 'drinks' },
  noEvents: { ja: 'まだ記録なし。カードをタップ！', en: 'No records yet — tap a card!' },
  noComments: { ja: 'コメントなし', en: 'No comments' },
  noHistory: { ja: 'まだ履歴なし', en: 'No history yet' },
  moods: {
    ja: ['😀 いい感じ', '🥴 酔ってきた', '😵 飲みすぎ！', '☠️ 明日ヤバい…'],
    en: ['😀 Feeling good', '🥴 Getting tipsy', '😵 Too much!', '☠️ Tomorrow = pain…'],
  },
  hydrated: { ja: '（💧効いてる）', en: ' (💧hydrated!)' },
  drinkWater: { ja: '　💧水も飲め！', en: ' 💧Drink water!' },
  namePrompt: { ja: '名前は？', en: 'Name?' },
  dupName: { ja: '同じ名前がいます', en: 'That name already exists' },
  noRecords: { ja: 'まだ記録がありません', en: 'Nothing recorded yet' },
  endConfirm: { ja: '今日の会を締めて履歴に保存する？', en: 'End tonight\'s session and save to history?' },
  savedNew: { ja: '保存しました。新しい会を開始！', en: 'Saved! New session started.' },
  importConfirm: { ja: '今のデータを読み込んだ内容で置き換える？', en: 'Replace current data with the loaded file?' },
  importErr: { ja: 'JSONが読めませんでした', en: 'Could not read that JSON' },
};
const T = k => L[k][lang()];
const Lf = {
  soberBy: (tomorrow, h) => lang() === 'ja'
    ? `　🕐${tomorrow ? '明日' : ''}${h}時に抜ける`
    : ` 🕐 sober by ${h}:00${tomorrow ? ' tomorrow' : ''}`,
  tennis: r => lang() === 'ja'
    ? `${r.toFixed(1)}R（約${(r / 6).toFixed(1)}回）分`
    : `${r.toFixed(1)} rounds (~${(r / 6).toFixed(1)} sessions)`,

// ---- 効果音（WebAudio・ファイル不要） ----
let AC;
function playSound(kind) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const noiseBuf = dur => {
      const len = Math.floor(AC.sampleRate * dur);
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    };
    const noise = (start, dur, filterType, freq, peak) => {
      const src = AC.createBufferSource(); src.buffer = noiseBuf(dur);
      const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(peak, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start(start);
      return f;
    };
    const glug = (start, f1, f2, dur, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f1, start);
      o.frequency.exponentialRampToValueAtTime(f2, start + dur * 0.8);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(vol, start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(start); o.stop(start + dur + 0.02);
    };
    if (kind === 'beer') {
      // カシュッ（缶オープン）→ プシュー → 泡がジューッと注がれる
      noise(t0, 0.06, 'highpass', 2500, 0.9);
      noise(t0 + 0.05, 0.25, 'highpass', 5000, 0.5);
      const foam = noise(t0 + 0.3, 1.0, 'bandpass', 4500, 0.4);
      foam.frequency.setValueAtTime(5500, t0 + 0.3);
      foam.frequency.exponentialRampToValueAtTime(2200, t0 + 1.3);
    } else if (kind === 'water') {
      // 軽いコポコポ
      [0, 0.12].forEach(dt => glug(t0 + dt, 620, 320, 0.1, 0.25));
    } else if (kind === 'wine' || kind === 'cocktail') {
      // トゥクトゥクトゥク（注ぐ音）。カクテルは炭酸のシュワも足す
      [0, 0.14, 0.28, 0.42].forEach((dt, i) => glug(t0 + dt, 480 + i * 60, 240, 0.12, 0.35));
      if (kind === 'cocktail') noise(t0 + 0.5, 0.6, 'bandpass', 5000, 0.25);
    } else {
      // ウイスキー：ポンプのシュコッ（プッシュ感）＋トポッ
      noise(t0, 0.09, 'bandpass', 1200, 0.7);
      glug(t0 + 0.09, 180, 90, 0.14, 0.5);
      glug(t0 + 0.24, 420, 250, 0.1, 0.3);
    }
  } catch (e) { /* 音が出なくてもカウントは止めない */ }
}

// ---- UI効果音（テレン・テンテン・テッテレー等） ----
function toneSeq(notes, type = 'triangle', vol = 0.2, delay = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    let t = AC.currentTime + delay;
    for (const [f, d] of notes) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
      t += d * 0.85;
    }
  } catch (e) {}
}

// ---- タップ（1杯）／長押し（半杯） ----
function tap(name, ev, amt = 1) {
  const gBefore = alcGFor(name);
  const topBefore = top3Names();
  playSound(currentDrink);
  S().events.push({ t: Date.now(), person: name, drink: currentDrink, amt });
  save(); render();
  const topAfter = top3Names();
  const gAfter = alcGFor(name);
  if (gBefore < 60 && gAfter >= 60) alertWarn(name, 4);
  else if (gBefore < 40 && gAfter >= 40) alertWarn(name, 3);
  else if (topAfter[0] && topAfter[0] !== topBefore[0]) {
    SFX.champ(); confetti(50);
    showToast(Lf.champToast(topAfter[0]), 'goldToast');
  }
  else if (topAfter.join() !== topBefore.join()) { SFX.rank(); confetti(14); }
  // 5杯ごとの節目祝福（チェイサー除く）
  const stNow = statsFor(S(), name);
  const cupsNow = Object.entries(stNow).reduce((a, [k, v]) => a + (k === 'water' ? 0 : v.taps), 0);
  if (currentDrink !== 'water' && cupsNow > 0 && Number.isInteger(cupsNow) && cupsNow % 5 === 0) {
    confetti(20); SFX.add();
    showToast(Lf.milestone(name, cupsNow), 'goldToast');
  }
  // 💧水3杯ごとの水分マスター祝福
  if (currentDrink === 'water') {
    const w = (stNow.water || { taps: 0 }).taps;
    if (w > 0 && Number.isInteger(w) && w % 3 === 0) {
      showToast(Lf.aquaToast(name, w), 'aquaToast'); SFX.add();
    }
  }
  if (ev) {
    const p = document.createElement('div');
    p.className = 'pop'; p.textContent = amt === 0.5 ? '+½' : '+1';
    p.style.left = ev.clientX + 'px'; p.style.top = (ev.clientY - 48) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
    // グビグビ（グラスが傾く）
    const gl = document.createElement('div');
    gl.className = 'gulp'; gl.textContent = DRINKS[currentDrink].icon;
    gl.style.left = (ev.clientX - 22) + 'px'; gl.style.top = (ev.clientY - 12) + 'px';
    document.body.appendChild(gl);
    setTimeout(() => gl.remove(), 1100);
    sparks(ev.clientX, ev.clientY);
    megaReaction(currentDrink);
  }
}
// 飲みすぎ警報：しきい値を超えた瞬間にピコンピコン＋トースト
function alertWarn(name, lvl) {
  try {
    const n = lvl === 4 ? 6 : 3, f = lvl === 4 ? 988 : 880;
    for (let i = 0; i < n; i++) {
      const o = AC.createOscillator(), g = AC.createGain();
      const ts = AC.currentTime + 0.35 + i * (lvl === 4 ? 0.16 : 0.25);
      o.type = 'square'; o.frequency.setValueAtTime(i % 2 ? f * 0.75 : f, ts);
      g.gain.setValueAtTime(0.0001, ts);
      g.gain.linearRampToValueAtTime(0.22, ts + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ts + 0.15);
      o.connect(g); g.connect(AC.destination); o.start(ts); o.stop(ts + 0.16);
    }
  } catch (e) {}
  const t = document.createElement('div');
  t.className = 'toast' + (lvl === 4 ? ' t4toast' : '');
  t.textContent = lvl === 4 ? Lf.warn4(name) : Lf.warn3(name);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function statsFor(session, name) {
  const out = {};
  for (const k of Object.keys(DRINKS)) {
    const n = session.events.filter(e => e.person === name && e.drink === k)
      .reduce((a, e) => a + (e.amt || 1), 0);
    if (n) out[k] = { taps: n, ml: n * getMl(k), cups: (n * getMl(k) / cupMlOf(k)) };
  }
  return out;
}

const EQ_UNITS = { beer: ['🍺', '缶分', ' cans'], wine: ['🍷', '杯分', ' glasses'], whisky: ['🥃', 'プッシュ分', ' pushes'] };
const eqUnit = () => store.settings.eqUnit || 'beer';

  return `${EQ_UNITS[u][0]}${(g / per).toFixed(1)}${lang() === 'ja' ? EQ_UNITS[u][1] : EQ_UNITS[u][2]}`;
}
function cycleEq() {
  const keys = Object.keys(EQ_UNITS);
  store.settings.eqUnit = keys[(keys.indexOf(eqUnit()) + 1) % keys.length];
  SFX.click();

}
function alcGFor(name) {

  return Object.entries(st).reduce((a, [k, v]) => a + v.ml * getMl('abv_' + k) / 100 * 0.8, 0);
}

    .reduce((a, e) => a + (e.amt || 1), 0) * getMl('whisky');

// ---- 会の終了・履歴 ----
function endSession() {
  if (!S().events.length && !S().comments.length) { alert(T('noRecords')); return; }
  if (!confirm(T('endConfirm'))) return;
  store.history.unshift(S());
  const people = S().people;
  store.current = newSession();
  store.current.people = people; // メンバーは引き継ぐ
  SFX.close();
  save(); render();
  alert(T('savedNew'));
}
function sessionSummary(s) {
  return s.people.map(name => {
    const st = statsFor(s, name);
    const parts = Object.entries(st).map(([k, v]) => `${DRINKS[k].icon}${fmtN(v.taps)}`);
    return parts.length ? `${name}: ${parts.join(' ')}` : null;
  }).filter(Boolean).join('　');
}

// ---- JSON入出力 ----
function exportJSON() {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nomikai-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}
function importJSON() {
  const input = document.getElementById('fileInput');
  input.onchange = () => {
    const f = input.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!data.current) throw new Error();
        if (!confirm(T('importConfirm'))) return;
        store = data; save(); applyStatic(); buildSettings(); render();
      } catch (e) { alert(T('importErr')); }
    };
    r.readAsText(f);
  };
  input.click();
}

// ---- マスタ設定 ----
function setMaster(k, v) {
  const n = parseFloat(v);
  if (!n || n <= 0) { render(); return; }
  store.settings[k] = n; save(); render();
}
function renderSettings() {
  for (const k of Object.keys(DEFAULT_SETTINGS)) {
    const el = document.getElementById('set_' + k);
    if (el && document.activeElement !== el) el.value = getMl(k);
  }
}

// ---- 表示 ----
function toggle(id) { document.getElementById(id).classList.toggle('hidden'); }

function render() {
  // ドリンクタブ
  document.getElementById('drinkTabs').innerHTML = Object.entries(DRINKS).map(([k, d]) =>
    `<button class="${k === currentDrink ? 'active' : ''}" onclick="currentDrink='${k}';SFX.tab();render()">${d.icon} ${lang() === 'en' ? d.en : d.label}</button>`
  ).join('');

  // ボトル残量（ウイスキーのみ）
  const wrap = document.getElementById('bottleWrap');
  const bottleMl = getMl('bottle');
  const used = whiskyUsedMl(S());
  const remain = Math.max(0, bottleMl - used);
  document.getElementById('bottleText').textContent = `${(remain / 1000).toFixed(2)}L / ${(bottleMl / 1000).toFixed(1)}L`;
  document.getElementById('bottleBar').style.width = (remain / bottleMl * 100) + '%';
  renderSettings();
  wrap.style.display = 'block';

  // 摂取量トップ3ランキング（タップごとにリアルタイム更新）
  const medals = ['🥇', '🥈', '🥉'];
  const ranked = S().people.map(n => ({ n, g: alcGFor(n) }))
    .filter(p => p.g > 0).sort((a, b) => b.g - a.g).slice(0, 3);
  // 💧ハイドレーションヒーロー（水2杯以上の最多者）
  const waterRank = S().people.map(n => ({ n, w: (statsFor(S(), n).water || { taps: 0 }).taps }))
    .sort((a, b) => b.w - a.w);
  const aquaHero = waterRank[0] && waterRank[0].w >= 2 ? waterRank[0].n : null;
  document.getElementById('ranking').innerHTML = ranked.length
    ? `<span class="tw" style="top:8px;left:5%">✨</span>
       <span class="tw" style="top:62%;left:2%;animation-delay:.5s">✨</span>
       <span class="tw" style="top:14%;right:4%;animation-delay:.9s">⭐</span>
       <span class="tw" style="bottom:8px;right:14%;animation-delay:1.2s">✨</span>
       <div class="rankHead"><span>${T('rankTitle')}</span>
         <span class="eqToggle" onclick="cycleEq()">${Lf.eqChip(EQ_UNITS[eqUnit()][0], getMl(eqUnit()))}</span></div>` +
      ranked.map((p, i) => {
        const pct = Math.max(5, p.g / ranked[0].g * 100);
        return `<div class="rankRow r${i}">
          <span class="rMedal">${medals[i]}</span>
          <span class="rName">${p.n}</span>
          <div class="rBarWrap"><div class="rBar" style="width:${pct}%"></div></div>
          <span class="rVal">${eqLabel(p.g)}</span>
        </div>`;
      }).join('')
    : '';

  // 🗑️ ゴミ山（全員合計の空き缶・空きボトル）
  const sumTaps = k => S().events.filter(e => e.drink === k).reduce((a, e) => a + (e.amt || 1), 0);
  // 空き容器の山：潰れた缶🥫・転がった瓶🍾・ペットボトル🧴
  const pile = (icon, n, cls) => {
    const w = Math.floor(n);
    return Array.from({ length: Math.min(w, 12) }, () => `<span class="${cls}">${icon}</span>`).join('')
      + (w > 12 ? `+${w - 12}` : '');
  };
  const ja = lang() === 'ja';
  const beerN = sumTaps('beer');
  const wineBot = sumTaps('wine') * getMl('wine') / getMl('wineBottle');
  const cockN = sumTaps('cocktail');
  const petN = sumTaps('water') * getMl('water') / getMl('waterPet');
  const whiskyBot = whiskyUsedMl(S()) / getMl('bottle');
  const tParts = [];
  if (beerN) tParts.push(`<span class="pile">${pile('🥫', beerN, 'cCan') || '<span class="cCan">🥫</span>'}</span><span class="tN">${fmtN(beerN)}${ja ? '缶' : ' cans'}</span>`);
  if (wineBot > 0) tParts.push(`<span class="pile">${pile('🍾', wineBot, 'cBottle') || '🍷'}</span><span class="tN">${wineBot.toFixed(1)}${ja ? '本' : ' bottles'}</span>`);
  if (cockN) tParts.push(`<span class="pile">${pile('🍹', cockN, '') || '🍹'}</span><span class="tN">${fmtN(cockN)}${ja ? '杯' : ' glasses'}</span>`);
  if (petN > 0) tParts.push(`<span class="pile">${pile('🧴', petN, 'cPet') || '<span class="cPet">🧴</span>'}</span><span class="tN">${ja ? 'ペットボトル' : 'PET'} ${petN.toFixed(1)}${ja ? '本' : ''}</span>`);
  if (whiskyBot > 0) tParts.push(`<span class="pile">🥃</span><span class="tN">${ja ? 'ニッカボトル' : 'Nikka bottle'} ${whiskyBot.toFixed(2)}${ja ? '本' : ''}</span>`);
  document.getElementById('trash').innerHTML = tParts.length
    ? `<span class="tTitle">${ja ? '🗑️ 本日のゴミ山' : '🗑️ Tonight\'s trash pile'}</span>` + tParts.join('')
    : '';

  // 参加者カード
  const d = DRINKS[currentDrink];
  const grid = document.getElementById('grid');
  grid.innerHTML = S().people.map(name => {
    const st = statsFor(S(), name);
    const totalTaps = Object.entries(st).reduce((a, [k, v]) => a + (k === 'water' ? 0 : v.taps), 0);
    const glasses = Object.entries(st).map(([k, v]) => {
      const whole = Math.floor(v.taps), half = v.taps % 1 >= 0.25;
      const icons = DRINKS[k].icon.repeat(Math.min(whole, 12)) + (whole > 12 ? '…' : '') + (half ? '<span class="half">½</span>' : '');
      return `<div>${icons}<span class="gN"> ${Lf.gN(v.taps)}</span></div>`;
    }).join('');
    const kcal = Math.round(Object.entries(st).reduce((a, [k, v]) => a + v.ml * getMl('kcal100_' + k) / 100, 0));
    const rounds = kcal / getMl('tennisRoundKcal');
    const tennis = Lf.tennis(rounds);
    const waterMl = st.water ? st.water.ml : 0;
    const alcMl = Object.entries(st).reduce((a, [k, v]) => a + (k === 'water' ? 0 : v.ml), 0);
    const alcG = Math.round(Object.entries(st).reduce((a, [k, v]) => a + v.ml * getMl('abv_' + k) / 100 * 0.8, 0));
    // チェイサーがお酒と同量以上なら判定を1段階マイルドに
    const goodChaser = alcMl > 0 && waterMl >= alcMl;
    let ti = alcG >= 60 ? 3 : alcG >= 40 ? 2 : alcG >= 20 ? 1 : 0;
    if (goodChaser && ti > 0) ti--;
    const tier = ['t1', 't2', 't3', 't4'][ti];
    let mood = L.moods[lang()][ti];
    if (goodChaser) mood += T('hydrated');
    else if (alcG >= 40 && waterMl < alcMl * 0.5) mood += T('drinkWater');
    if (alcG >= 20) {
      const end = new Date(Date.now() + alcG / getMl('burnGh') * 3600e3);
      const tomorrow = end.getDate() !== new Date().getDate();
      mood += Lf.soberBy(tomorrow, end.getHours());
    }
    const esc = name.replace(/'/g, "\\'");
    const cardCls = tier === 't3' ? 'warn3' : tier === 't4' ? 'warn4' : (aquaHero === name ? 'aqua' : '');
    return `<div class="person ${cardCls}" onclick="cardClick('${esc}', event)"
      onpointerdown="pressStart('${esc}', event)" onpointerup="pressEnd()" onpointerleave="pressEnd()">
      <div class="del" onclick="removePerson('${esc}', event)">✕</div>
      <div class="name">${ranked[0] && ranked[0].n === name ? '👑 ' : ''}${aquaHero === name ? '💧' : ''}${name}</div>
      <div class="count">${fmtN(totalTaps)}<span class="cupsUnit">${T('cupsUnit')}</span></div>
      <div class="glasses">${glasses || '&nbsp;'}</div>
      <div class="alc ${tier}">🍶 ${Math.round(alcMl)}ml＝${eqLabel(alcG)}・💧${Math.round(waterMl)}ml　${mood}</div>
      <div class="kcal">🔥 ${kcal}kcal ≒ 🎾 ${tennis}</div>
    </div>`;
  }).join('') + `<div class="addCard" onclick="addPerson()">${T('addCard')}</div>`;

  // イベントログ
  document.getElementById('eventLog').innerHTML = S().events.slice(-30).reverse().map(e =>
    `<li>${fmtTime(e.t)} <b>${e.person}</b> ${DRINKS[e.drink].icon} ${e.amt === 0.5 ? '+½' : '+1'}</li>`
  ).join('') || `<li>${T('noEvents')}</li>`;

  // コメントログ
  document.getElementById('commentLog').innerHTML = S().comments.slice().reverse().map(c =>
    `<li>${fmtTime(c.t)} ${c.text}</li>`
  ).join('') || `<li>${T('noComments')}</li>`;
}

function renderHistory() {
  const el = document.getElementById('historyList');
  el.innerHTML = store.history.map((s, i) => {
    const date = new Date(s.date).toLocaleDateString('ja-JP');
    const n = s.events.length;
    const cm = s.comments.map(c => `「${c.text}」`).join(' ');
    return `<div class="historyItem">
      <b>${date}</b>${Lf.histLine(s.people.length, n)}
      <div class="sum">${sessionSummary(s)}</div>
      ${cm ? `<div class="sum">💬 ${cm}</div>` : ''}
    </div>`;
  }).join('') || `<div class="sum" style="color:var(--sub);font-size:14px">${T('noHistory')}</div>`;
}

applyStatic();
buildSettings();
render();
</script>
</body>
</html>

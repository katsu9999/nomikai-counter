<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14100c">
<title>GG グビロワイヤル</title>
<style>
  :root {
    --bg: #14100c;
    --card: #241c14;
    --card-tap: #3a2c1c;
    --amber: #d99a2b;
    --amber-dim: #8a6320;
    --text: #f2e8d8;
    --sub: #a89878;
    --line: #3c3020;
    --danger: #c05040;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, .person, .addCard, .eqToggle, .drinkTabs button { touch-action: manipulation; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    min-height: 100vh; padding: 16px; user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 20px; color: var(--amber); white-space: nowrap; }
  .drinkTabs { display: flex; gap: 6px; }
  .drinkTabs button {
    font-size: 18px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--sub); cursor: pointer;
  }
  .drinkTabs button.active { background: var(--amber); color: #1a1408; border-color: var(--amber); font-weight: bold; }
  .bottle { flex: 1; min-width: 200px; }
  .bottle .label { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; margin-bottom: 3px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--amber); border-radius: 5px; transition: width .3s; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .person {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px 16px; cursor: pointer; text-align: center; position: relative;
    transition: background .1s, transform .05s;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  .half { font-size: 15px; color: var(--sub); vertical-align: middle; }
  .hint { font-size: 13px; color: var(--sub); margin: -6px 0 12px; }
  .ranking {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 14px; position: relative; overflow: hidden;
    animation: rankGlow 2.4s ease-in-out infinite;
  }
  @keyframes rankGlow {
    0%, 100% { box-shadow: 0 0 6px 0 rgba(217, 154, 43, .2); border-color: var(--line); }
    50% { box-shadow: 0 0 22px 4px rgba(217, 154, 43, .55); border-color: var(--amber); }
  }
  .tw { position: absolute; font-size: 16px; pointer-events: none; animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .1; transform: scale(.6) rotate(0); }
    50% { opacity: 1; transform: scale(1.2) rotate(20deg); }
  }
  .ranking:empty { display: none; }
  .rankHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; color: var(--amber); font-weight: bold; }
  .trash {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 16px; margin-bottom: 14px; font-size: 15px;
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  }
  .trash:empty { display: none; }
  .trash .tTitle { color: var(--amber); font-weight: bold; font-size: 14px; }
  .trash .pile { font-size: 22px; word-break: break-all; }
  .trash .pile span { display: inline-block; }
  .trash .cCan { transform: scaleY(.6) rotate(-11deg); filter: saturate(.75) brightness(.85); }
  .trash .pile span:nth-child(even).cCan { transform: scaleY(.62) rotate(10deg); }
  .trash .cBottle { transform: rotate(102deg); filter: brightness(.85); }
  .trash .pile span:nth-child(even).cBottle { transform: rotate(78deg) scaleY(.95); }
  .trash .cPet { transform: rotate(-16deg); opacity: .85; }
  .trash .pile span:nth-child(even).cPet { transform: rotate(15deg) scaleY(.9); }
  .trash .tN { color: var(--sub); font-size: 13px; margin-left: -8px; }
  .rankRow { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .rMedal { width: 34px; text-align: center; }
  .rName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32%; }
  .rBarWrap { flex: 1; background: var(--line); border-radius: 7px; overflow: hidden; }
  .rBar { background: var(--amber); border-radius: 7px; transition: width .3s; }
  .rVal { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .r0 .rMedal { font-size: 30px; }
  .r0 .rName { font-size: 26px; font-weight: bold; color: var(--amber); animation: nameGlow 1.8s ease-in-out infinite; }
  @keyframes nameGlow {
    0%, 100% { text-shadow: 0 0 8px rgba(240, 184, 64, .5); }
    50% { text-shadow: 0 0 22px rgba(255, 224, 138, 1); }
  }
  .r0 .rBar {
    height: 18px;
    background: linear-gradient(90deg, var(--amber), #f0b840, #ffe08a, #f0b840, var(--amber));
    background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }
  .r0 .rVal { font-size: 16px; font-weight: bold; color: var(--text); }
  .r1 .rMedal { font-size: 21px; }
  .r1 .rName { font-size: 18px; }
  .r1 .rBar { height: 12px; }
  .r2 .rMedal { font-size: 17px; }
  .r2 .rName { font-size: 15px; color: var(--sub); }
  .r2 .rBar { height: 8px; background: var(--amber-dim); }
  .eqToggle {
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
    font-size: 13px; color: var(--sub); cursor: pointer; background: var(--bg); font-weight: normal;
  }
  .aquaRank {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 15px; color: #7ec4e8; font-weight: bold;
    animation: nameGlow 2s ease-in-out infinite;
  }
  .person:active { background: var(--card-tap); transform: scale(0.97); }
  .person .name { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
  .person .count { font-size: 44px; font-weight: bold; color: var(--amber); line-height: 1.1; }
  .person .count .cupsUnit { font-size: 17px; color: var(--sub); margin-left: 4px; font-weight: normal; }
  .person .gN { font-size: 13px; color: var(--sub); }
  .person .detail { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .person .glasses { margin-top: 8px; font-size: 21px; line-height: 1.35; word-break: break-all; min-height: 28px; }
  .person .kcal { margin-top: 4px; font-size: 13px; color: var(--amber); }
  .person .alc { margin-top: 8px; font-size: 13px; }
  .person .aquaLine { margin-top: 4px; font-size: 13px; color: #7ec4e8; font-weight: bold; }
  .person .luckLine { margin-top: 4px; font-size: 13px; color: #d99a2b; }
  .alc.t1 { color: var(--sub); }
  .alc.t2 { color: var(--amber); }
  .alc.t3 { color: #e0762e; font-weight: bold; }
  .alc.t4 { color: var(--danger); font-weight: bold; }
  .person .del {
    position: absolute; top: 8px; right: 10px; color: var(--sub); font-size: 14px;
    padding: 4px 8px; opacity: .5;
  }
  .person .del.edit { right: auto; left: 10px; }
  .person .bubble {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #1a1408; font-size: 13px; font-weight: bold;
    padding: 6px 12px; border-radius: 14px; white-space: nowrap; max-width: 92%;
    overflow: hidden; text-overflow: ellipsis; z-index: 5;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .55); animation: bubblePop .3s;
  }
  .person .bubble::after {
    content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  @keyframes bubblePop { from { transform: translateX(-50%) scale(.4); opacity: 0; } }
  .grid { padding-top: 10px; }
  .person .dRow { display: flex; justify-content: center; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
  /* コンパクト表示（.mini はカード個別に付く）：詳細行を隠して1画面に大人数 */
  .grid.compact { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
  .person.mini { padding: 10px 8px; }
  .person.mini .glasses, .person.mini .alc, .person.mini .kcal,
  .person.mini .aquaLine, .person.mini .luckLine { display: none; }
  .person.mini .name { font-size: 17px; margin-bottom: 2px; }
  .person.mini .count { font-size: 30px; }
  .person.mini .count .cupsUnit { font-size: 13px; }
  .person.mini .dBtn { font-size: 15px; padding: 4px 5px; border-radius: 8px; }
  .person.mini .dRow { gap: 3px; margin-top: 6px; }
  /* コンパクトグリッド内で詳細化した人は2枠分に広がって主役化（他は小さいまま） */
  @media (min-width: 500px) {
    .grid.compact .person:not(.mini) { grid-column: span 2; }
  }
  .person .del.sizeBtn { left: 44px; right: auto; }
  .miniHint { margin-top: 6px; font-size: 11px; color: var(--sub); }
  .person.mini { cursor: pointer; }
  /* 弾幕（スマホからのコメントが流れる） */
  .danmaku {
    position: fixed; left: 100vw; z-index: 93; pointer-events: none;
    font-size: 28px; font-weight: bold; color: #fff; white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .95), 0 0 14px rgba(240, 184, 64, .5);
    animation: flyLeft linear forwards;
  }
  @keyframes flyLeft { to { transform: translateX(calc(-100vw - 100%)); } }
  .danmaku.big {
    font-size: min(54px, 7.5vw); color: #ffe08a;
    text-shadow: 0 3px 12px rgba(0, 0, 0, .95), 0 0 26px var(--amber);
  }
  /* ゲスト（スマホリモコン）画面 */
  .gWrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  .gWrap input { padding: 13px; font-size: 17px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .gGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .gBtn {
    font-size: 36px; padding: 16px 8px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer;
  }
  .gBtn span { font-size: 14px; color: var(--sub); }
  .gBtn:active { transform: scale(.95); background: var(--card-tap); }
  .person .dBtn {
    font-size: 24px; padding: 7px 9px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; cursor: pointer; transition: transform .08s;
  }
  .person .dBtn:active { transform: scale(1.25); background: var(--card-tap); }
  .person .dBtn.dVibe { border-color: var(--amber-dim); filter: drop-shadow(0 0 5px rgba(240, 184, 64, .45)); }
  .addCard {
    border: 2px dashed var(--line); border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 17px; color: var(--sub); padding: 18px; cursor: pointer; min-height: 130px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar button {
    padding: 12px 16px; font-size: 15px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  .toolbar button.warn { color: var(--danger); border-color: var(--danger); }

  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  section h2 { font-size: 15px; color: var(--amber); margin-bottom: 10px; }
  .commentRow { display: flex; gap: 8px; margin-bottom: 10px; }
  .commentRow input {
    flex: 1; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  .commentRow button { padding: 12px 18px; border-radius: 8px; border: none; background: var(--amber); color: #1a1408; font-weight: bold; font-size: 15px; cursor: pointer; }
  .log { list-style: none; font-size: 14px; color: var(--sub); max-height: 180px; overflow-y: auto; }
  .log li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log li b { color: var(--text); }
  .setRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 15px; }
  .setRow input {
    width: 90px; padding: 8px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); text-align: right;
  }
  .historyItem { padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  .historyItem .sum { font-size: 13px; color: var(--sub); margin-top: 3px; }
  .hidden { display: none; }
  .person.aqua { animation: aquaGlow 2s ease-in-out infinite; }
  @keyframes aquaGlow {
    0%, 100% { box-shadow: 0 0 6px 0 rgba(126, 196, 232, .3); }
    50% { box-shadow: 0 0 20px 4px rgba(126, 196, 232, .8); border-color: #7ec4e8; }
  }
  .toast.aquaToast { background: #7ec4e8; color: #0c2430; }
  @keyframes pulseWarn {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224, 118, 46, 0); }
    50% { box-shadow: 0 0 16px 3px rgba(224, 118, 46, .7); border-color: #e0762e; }
  }
  .person.warn3 { animation: pulseWarn 1.6s infinite; }
  @keyframes pulseYellow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240, 200, 60, 0); }
    50% { box-shadow: 0 0 14px 3px rgba(240, 200, 60, .55); border-color: #f0c83c; }
  }
  .person.warn2 { animation: pulseYellow 2s infinite; }
  @keyframes pulseDanger {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 80, 64, 0); }
    50% { box-shadow: 0 0 22px 6px rgba(192, 80, 64, .9); border-color: var(--danger); }
  }
  .person.warn4 { animation: pulseDanger 0.9s infinite; }
  .toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: #e0762e; color: #fff; font-weight: bold; font-size: 16px;
    padding: 12px 22px; border-radius: 12px; z-index: 100; white-space: nowrap;
    animation: toastIn 3.5s forwards;
  }
  .toast.t4toast { background: var(--danger); }
  .toast.goldToast { background: var(--amber); color: #1a1408; }
  .confetti {
    position: fixed; top: -14px; width: 10px; height: 14px; border-radius: 2px;
    z-index: 98; pointer-events: none; animation: confFall linear forwards;
  }
  @keyframes confFall { to { transform: translateY(108vh) rotate(720deg); opacity: .8; } }
  .cracker { position: fixed; top: 16%; font-size: 64px; z-index: 98; pointer-events: none; animation: crackerPop 1.5s ease-out forwards; }
  @keyframes crackerPop {
    0% { transform: scale(0.3); opacity: 0; }
    20% { transform: scale(1.5); opacity: 1; }
    60% { transform: scale(1); }
    100% { opacity: 0; }
  }
  .cut { position: fixed; inset: 0; z-index: 95; pointer-events: none; background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,.5)); animation: cutFade 4.5s forwards; }
  @keyframes cutFade { 0% { opacity: 0; } 5%, 88% { opacity: 1; } 100% { opacity: 0; } }
  .cutBall { position: absolute; top: 28%; left: -10%; font-size: 72px; animation: ballFly 1.1s ease-in forwards; }
  .cutBall.b2 { top: 60%; animation: ballFly 1.1s ease-in 2.1s backwards; animation-fill-mode: both; }
  @keyframes ballFly {
    0% { left: -10%; transform: translateY(0) rotate(0); }
    50% { transform: translateY(-90px) rotate(360deg); }
    100% { left: 105%; transform: translateY(12px) rotate(900deg); }
  }
  .cutText {
    position: absolute; top: 40%; left: 50%; font-size: min(64px, 9vw); font-weight: 900; font-style: italic;
    color: #fff; text-shadow: 0 0 26px var(--amber), 0 4px 0 #7a5510; white-space: nowrap;
    animation: slam 4.5s cubic-bezier(.2, 1.4, .4, 1) forwards;
  }
  @keyframes slam {
    0% { transform: translate(-50%, -50%) scale(3) rotate(-6deg); opacity: 0; }
    6% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; }
    88% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.08) rotate(-3deg); opacity: 0; }
  }
  .cutSub {
    position: absolute; top: 56%; left: 50%; font-size: min(38px, 6vw); font-weight: 900;
    color: #ffe08a; text-shadow: 0 0 18px rgba(0,0,0,.8), 0 0 22px var(--amber); white-space: nowrap;
    animation: subIn 4.5s ease-out forwards;
  }
  @keyframes subIn {
    0%, 24% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    36% { transform: translate(-50%, -50%) scale(1); }
    88% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.05); opacity: 0; }
  }
  .cutIcon { position: absolute; top: 70%; left: 50%; font-size: 96px; transform: translateX(-50%); animation: iconPulse 4.5s ease-out forwards; }
  @keyframes iconPulse {
    0% { transform: translateX(-50%) scale(.3); opacity: 0; }
    8% { transform: translateX(-50%) scale(1.4); opacity: 1; }
    16% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.12); }
    60% { transform: translateX(-50%) scale(1); }
    88% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 0; }
  }
  .waterCut { background: radial-gradient(circle, rgba(0, 0, 0, 0) 40%, rgba(20, 60, 90, .55)); }
  .waterCut .cutText { text-shadow: 0 0 26px #7ec4e8, 0 4px 0 #1a4a66; }
  .finale {
    position: fixed; inset: 0; z-index: 99; background: rgba(10, 7, 4, .93);
    display: flex; flex-direction: column; align-items: center; padding-top: 8vh;
    animation: finFade .5s;
  }
  @keyframes finFade { from { opacity: 0; } to { opacity: 1; } }
  .finTitle { font-size: min(52px, 8vw); font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 0 24px var(--amber); margin-bottom: 4vh; animation: nameGlow 1.6s infinite; }
  .finList { display: flex; flex-direction: column; gap: 14px; min-height: 16vh; align-items: center; }
  .finLine { font-size: min(34px, 6vw); font-weight: bold; color: var(--text); opacity: 0; transform: scale(2); transition: all .35s cubic-bezier(.2, 1.4, .4, 1); }
  .finLine.show { opacity: 1; transform: scale(1); }
  .finChampWrap { opacity: 0; transform: scale(.2); transition: all .5s cubic-bezier(.2, 1.6, .4, 1); text-align: center; margin-top: 2vh; }
  .finChampWrap.show { opacity: 1; transform: scale(1); }
  .finCrown { font-size: min(90px, 14vw); animation: crownBounce 1s ease-in-out infinite; }
  @keyframes crownBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .finChamp { font-size: min(64px, 9vw); font-weight: 900; color: var(--amber); animation: nameGlow 1.2s infinite; }
  .finChampSub { font-size: min(30px, 5vw); font-weight: 900; color: #ffe08a; }
  .finFoot { margin-top: 4vh; font-size: min(24px, 4.5vw); color: var(--text); opacity: 0; transition: opacity .6s; font-weight: bold; }
  .finFoot.show { opacity: 1; }
  .finSkip { position: absolute; bottom: 18px; right: 22px; font-size: 13px; color: var(--sub); }
  .finJime { margin-top: 3vh; font-size: min(38px, 6.5vw); font-weight: 900; color: #fff; text-shadow: 0 0 18px var(--amber); min-height: 1.4em; text-align: center; }
  .clapPop { position: fixed; font-size: 64px; z-index: 100; pointer-events: none; animation: clapAnim .5s ease-out forwards; }
  @keyframes clapAnim {
    0% { transform: scale(.3); opacity: 0; }
    30% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
  .omikujiCut { background: radial-gradient(circle, rgba(0,0,0,.1) 30%, rgba(40, 10, 60, .65)); animation-duration: 5.2s; }
  .omBox { position: absolute; top: 26%; left: 50%; font-size: 110px; transform: translateX(-50%); animation: omShake .3s linear 0s 8; }
  @keyframes omShake {
    0%, 100% { transform: translateX(-52%) rotate(-12deg); }
    50% { transform: translateX(-48%) rotate(12deg); }
  }
  .omTitle { animation-duration: 2.5s; }
  .omResult {
    position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%) scale(0);
    font-size: min(90px, 13vw); font-weight: 900; color: #ffe08a;
    text-shadow: 0 0 34px var(--amber), 0 5px 0 #7a5510; white-space: nowrap;
    transition: transform .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  .omResult.show { transform: translate(-50%, -50%) scale(1); }
  .omMsg {
    position: absolute; top: 58%; left: 50%; transform: translate(-50%, -50%);
    font-size: min(26px, 4.5vw); font-weight: bold; color: #fff; text-align: center; width: 84%;
    text-shadow: 0 2px 10px rgba(0,0,0,.9); opacity: 0; transition: opacity .5s;
  }
  .omMsg.show { opacity: 1; }
  .eventCut { animation-duration: 7.2s; }
  .championCut { animation-duration: 10.5s; }
  .waterBreak {
    position: fixed; inset: 0; z-index: 98; cursor: pointer;
    background: linear-gradient(180deg, rgba(10, 30, 50, .97), rgba(15, 62, 98, .97));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;

let AC;
function playSound(kind) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    const noiseBuf = dur => {
      const len = Math.floor(AC.sampleRate * dur);
      const buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    };
    const noise = (start, dur, filterType, freq, peak) => {
      const src = AC.createBufferSource(); src.buffer = noiseBuf(dur);
      const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(peak, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      src.connect(f); f.connect(g); g.connect(AC.destination);
      src.start(start);
      return f;
    };
    const glug = (start, f1, f2, dur, vol) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f1, start);
      o.frequency.exponentialRampToValueAtTime(f2, start + dur * 0.8);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(vol, start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(start); o.stop(start + dur + 0.02);
    };
    if (kind === 'beer') {
      // カシュッ（缶オープン）→ プシュー → 泡がジューッと注がれる
      noise(t0, 0.06, 'highpass', 2500, 0.9);
      noise(t0 + 0.05, 0.25, 'highpass', 5000, 0.5);
      const foam = noise(t0 + 0.3, 1.0, 'bandpass', 4500, 0.4);
      foam.frequency.setValueAtTime(5500, t0 + 0.3);
      foam.frequency.exponentialRampToValueAtTime(2200, t0 + 1.3);
    } else if (kind === 'water') {
      // 軽いコポコポ
      [0, 0.12].forEach(dt => glug(t0 + dt, 620, 320, 0.1, 0.25));
    } else if (kind === 'vibe') {
      // 拍手パチパチ
      clap(0); clap(0.14); clap(0.28);
    } else if (kind === 'wine' || kind === 'cocktail' || kind === 'sake') {
      // トゥクトゥクトゥク（注ぐ音）。カクテルは炭酸のシュワも足す
      [0, 0.14, 0.28, 0.42].forEach((dt, i) => glug(t0 + dt, 480 + i * 60, 240, 0.12, 0.35));
      if (kind === 'cocktail') noise(t0 + 0.5, 0.6, 'bandpass', 5000, 0.25);
    } else {
      // ウイスキー：ポンプのシュコッ（プッシュ感）＋トポッ
      noise(t0, 0.09, 'bandpass', 1200, 0.7);
      glug(t0 + 0.09, 180, 90, 0.14, 0.5);
      glug(t0 + 0.24, 420, 250, 0.1, 0.3);
    }
  } catch (e) { /* 音が出なくてもカウントは止めない */ }
}

function toneSeq(notes, type = 'triangle', vol = 0.2, delay = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const theme = soundTheme();
    let t = AC.currentTime + delay;
    for (const [f, d] of notes) {
      const mk = (freq, wave, v, dur, detune) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = wave; o.frequency.setValueAtTime(freq, t);
        if (detune) o.detune.setValueAtTime(detune, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(v, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(AC.destination);
        o.start(t); o.stop(t + dur + 0.02);
      };
      if (theme === 'orch') {
        // 弦セクション風：ノコギリ波＋1オクターブ下＋上の倍音・長めの余韻
        mk(f, 'sawtooth', vol * 0.5, d * 1.5);
        mk(f / 2, 'sine', vol * 0.6, d * 1.5);
        mk(f * 2, 'sawtooth', vol * 0.14, d * 1.2);
      } else if (theme === 'synth') {
        // スーパーソウ風：デチューン2枚＋サブベース
        mk(f, 'sawtooth', vol * 0.45, d, -9);
        mk(f, 'sawtooth', vol * 0.45, d, 9);
        mk(f / 2, 'sine', vol * 0.5, d);
      } else {
        mk(f, type, vol, d, 0); // 8bit（矩形波そのまま）
      }
      t += d * 0.85;
    }
  } catch (e) {}
}

// 飲みすぎ警報：しきい値を超えた瞬間にピコンピコン＋トースト
function alertWarn(name, lvl) {
  try {
    const n = lvl === 4 ? 6 : 3, f = lvl === 4 ? 988 : 880;
    for (let i = 0; i < n; i++) {
      const o = AC.createOscillator(), g = AC.createGain();
      const ts = AC.currentTime + 0.35 + i * (lvl === 4 ? 0.16 : 0.25);
      o.type = 'square'; o.frequency.setValueAtTime(i % 2 ? f * 0.75 : f, ts);
      g.gain.setValueAtTime(0.0001, ts);
      g.gain.linearRampToValueAtTime(0.22, ts + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ts + 0.15);
      o.connect(g); g.connect(AC.destination); o.start(ts); o.stop(ts + 0.16);
    }
  } catch (e) {}
  const t = document.createElement('div');
  t.className = 'toast' + (lvl === 4 ? ' t4toast' : '');

// ---- 集計 ----
function statsFor(session, name) {
  const out = {};
  for (const k of Object.keys(DRINKS)) {
    const n = session.events.filter(e => e.person === name && e.drink === k)
      .reduce((a, e) => a + (e.amt || 1), 0);
    if (n) out[k] = { taps: n, ml: n * getMl(k), cups: (n * getMl(k) / cupMlOf(k)) };
  }
  return out;
}
const fmtN = n => Number.isInteger(n) ? n : n.toFixed(1);
// 純アルgの換算表示。単位はタップで切替（🍺本分⇄🍷杯分⇄🥃プッシュ分）・マスタ連動
const EQ_UNITS = { beer: ['🍺', '缶分', ' cans'], wine: ['🍷', '杯分', ' glasses'], whisky: ['🥃', 'プッシュ分', ' pushes'] };
const eqUnit = () => store.settings.eqUnit || 'beer';
function eqLabel(g) {
  const u = eqUnit();
  const per = getMl(u) * getMl('abv_' + u) / 100 * 0.8;
  // ビール500ml以上ならパイント表記（パブモード）
  const unit = u === 'beer' && getMl('beer') >= 500
    ? (lang() === 'ja' ? 'パイント分' : ' pints')
    : (lang() === 'ja' ? EQ_UNITS[u][1] : EQ_UNITS[u][2]);
  return `${EQ_UNITS[u][0]}${(g / per).toFixed(1)}${unit}`;
}
function cycleEq() {
  const keys = Object.keys(EQ_UNITS);
  store.settings.eqUnit = keys[(keys.indexOf(eqUnit()) + 1) % keys.length];
  SFX.click();
  save(); render();
}
function alcGFor(name) {
  const st = statsFor(S(), name);
  return Object.entries(st).reduce((a, [k, v]) => a + v.ml * getMl('abv_' + k) / 100 * 0.8, 0);
}
function whiskyUsedMl(session) {
  return session.events.filter(e => e.drink === 'whisky')
    .reduce((a, e) => a + (e.amt || 1), 0) * getMl('whisky');
}

  t += 2500; at(t, () => jime(ja ? 'それでは皆さま、お手を拝借！' : 'Everyone, hands ready!'));
  t += 2300; at(t, () => { jime(ja ? 'よぉ〜〜〜っ！' : 'Yooo~~~!'); toneSeq([[392, 0.35], [523, 0.6]], 'triangle', 0.2); });
  t += 1800;

  at(t, () => jime(papapan));

function sessionSummary(s) {

      }).join('') + aquaRow
    : '';

  // 🗑️ ゴミ山（全員合計の空き缶・空きボトル）

    const tennis = Lf.tennis(rounds);
    const waterMl = st.water ? st.water.ml : 0;
    const wTaps = st.water ? st.water.taps : 0;
    const alcMl = Object.entries(st).reduce((a, [k, v]) => a + (k === 'water' ? 0 : v.ml), 0);

    // チェイサーがお酒と同量以上なら判定を1段階マイルドに
    // チェイサー段階緩和：水が酒の半分以上→1段階（赤→オレンジ）、同量以上→2段階＋水色グロー
    const ratio = alcMl > 0 ? waterMl / alcMl : 0;
    let ti = alcG >= 60 ? 3 : alcG >= 40 ? 2 : alcG >= 20 ? 1 : 0;
    if (ratio >= 1) ti = Math.max(0, ti - 2);
    else if (ratio >= 0.5) ti = Math.max(0, ti - 1);
    const hydratedBlue = alcMl > 0 && ratio >= 1;
    const tier = ['t1', 't2', 't3', 't4'][ti];
    let mood = L.moods[lang()][ti];
    if (hydratedBlue) mood += T('hydrated');
    else if (alcMl > 0 && ratio >= 0.5) mood += (lang() === 'ja' ? '（💧回復中）' : ' (💧recovering)');
    else if (alcG >= 40) mood += T('drinkWater');
    if (alcG >= 20) {
      const end = new Date(Date.now() + alcG / getMl('burnGh') * 3600e3);
      const tomorrow = end.getDate() !== new Date().getDate();
      mood += Lf.soberBy(tomorrow, end.getHours());
    }
    const esc = name.replace(/'/g, "\\'");
    // 飲まない人（純アル0で水あり）は全員ちゃんと青く光る。水最多ヒーローも青
    const soberBlue = alcG === 0 && wTaps > 0;
    // 色の旅：赤(t4)→オレンジ(t3)→黄(t2)→水色(💧十分)。飲まない人は常に水色
    const cardCls = tier === 't4' ? 'warn4' : tier === 't3' ? 'warn3'
      : (soberBlue || hydratedBlue || aquaHero === name) ? 'aqua'
      : tier === 't2' ? 'warn2' : '';
    const dRow = Object.keys(DRINKS).map(k =>
      `<button class="dBtn${k === 'vibe' ? ' dVibe' : ''}"
        onpointerdown="pressStart('${esc}', event, '${k}')" onpointerup="pressEnd()" onpointerleave="pressEnd()"

    ).join('');

    const bubble = lastC && (Date.now() - lastC.t < 300000)
      ? `<div class="bubble">💬 ${lastC.text}</div>` : '';
    return `<div class="person ${cardCls}${mini ? ' mini' : ''}"${mini ? ` onclick="expandCard('${esc}', event)"` : ''}>

      <div class="del" onclick="removePerson('${esc}', event)">✕</div>

      <div class="name">${ranked[0] && ranked[0].n === name ? '👑 ' : ''}${aquaHero === name || soberBlue ? '💧' : ''}${name}</div>
      <div class="count">${fmtN(totalTaps)}<span class="cupsUnit">${T('cupsUnit')}</span></div>
      <div class="dRow">${dRow}</div>
      ${mini ? `<div class="miniHint">⌄ ${lang() === 'ja' ? 'タップで詳細' : 'tap for details'}</div>` : ''}
      <div class="glasses">${glasses || '&nbsp;'}</div>
      <div class="alc ${tier}">🍶 ${Math.round(alcMl)}ml＝${eqLabel(alcG)}・💧${Math.round(waterMl)}ml　${mood}</div>
      ${(() => {
        if (!wTaps) return '';
        const lv = wTaps >= 6 ? 3 : wTaps >= 3 ? 2 : 1;
        const wt = { ja: ['', '💧いいケア！', '🛡️鉄壁ディフェンス！', '🏆リカバリーの神！'], en: ['', '💧Good care!', '🛡️Iron defense!', '🏆Recovery god!'] }[lang()][lv];
        const sober = alcG === 0 ? (lang() === 'ja' ? '　🏅ソバーヒーロー！すごい！' : ' 🏅Sober hero!') : '';
        return `<div class="aquaLine">💧${fmtN(wTaps)}${T('cupsUnit')}　${wt}${sober}</div>`;
      })()}
      ${(() => {
        const fs = (S().fortunes || []).filter(f => f.person === name);
        if (!fs.length) return '';
        const mega = fs.filter(f => f.label.includes('大大吉') || f.label.includes('MEGA')).length;
        const dai = fs.filter(f => (f.label.includes('大吉') && !f.label.includes('大大吉')) || f.label.includes('GREAT')).length;
        const jaL = lang() === 'ja';
        return `<div class="luckLine">🎋${jaL ? 'おみくじ' : 'fortunes ×'}${fs.length}${jaL ? '回' : ''}${dai ? `・🎉${jaL ? '大吉' : 'GREAT'}×${dai}` : ''}${mega ? `・🌸×${mega}` : ''}</div>`;
      })()}
      <div class="kcal">🔥 ${kcal}kcal ≒ 🎾 ${tennis}・🏃 ${(kcal / getMl('runKcalKm')).toFixed(1)}km</div>
    </div>`;
  }).join('') + `<div class="addCard" onclick="addPerson()">${T('addCard')}</div>`;

  // イベントログ
  document.getElementById('eventLog').innerHTML = S().events.slice(-30).reverse().map(e =>
    `<li>${fmtTime(e.t)} <b>${e.person}</b> ${DRINKS[e.drink].icon} ${e.amt === 0.5 ? '+½' : '+1'}</li>`
  ).join('') || `<li>${T('noEvents')}</li>`;

  // コメントログ
  document.getElementById('commentLog').innerHTML = S().comments.slice().reverse().map(c =>
    `<li>${fmtTime(c.t)} ${c.person ? `<b>${c.person}</b> ` : ''}${c.text}</li>`
  ).join('') || `<li>${T('noComments')}</li>`;
}

function renderHistory() {
  const el = document.getElementById('historyList');
  el.innerHTML = store.history.map((s, i) => {
    const date = new Date(s.date).toLocaleDateString('ja-JP');
    const n = s.events.length;
    const cm = s.comments.map(c => `「${(c.person ? c.person + ': ' : '') + c.text}」`).join(' ');
    return `<div class="historyItem">
      <b>${date}</b>${Lf.histLine(s.people.length, n)}
      <div class="sum">${sessionSummary(s)}</div>
      ${cm ? `<div class="sum">💬 ${cm}</div>` : ''}
    </div>`;
  }).join('') || `<div class="sum" style="color:var(--sub);font-size:14px">${T('noHistory')}</div>`;
}

// ---- 📱 リモート参加：QR・ポーリング・弾幕・ゲスト画面 ----
function danmaku(text, big) {
  const d = document.createElement('div');
  d.className = 'danmaku' + (big ? ' big' : ''); d.textContent = text;
  d.style.top = (8 + Math.random() * 55) + 'vh';
  d.style.animationDuration = (7 + Math.random() * 4) + 's';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 12000);
  toneSeq([[1319, .07], [1568, .13]], 'sine', 0.18); // ぴよ♪
}
function roomCode() {
  if (!store.settings.room) {
    const cs = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    store.settings.room = Array.from({ length: 4 }, () => cs[Math.floor(Math.random() * cs.length)]).join('');
    save();
  }
  return store.settings.room;
}
const guestUrl = () => location.origin + location.pathname + '?room=' + roomCode();
function openQr() {
  SFX.click();
  if (!SB_ON) { alert('Supabase未設定（index.htmlのSB_URL/SB_KEYを設定）'); return; }
  toggle('qrSec');
  document.getElementById('qrImg').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=380x380&data=' + encodeURIComponent(guestUrl());
  document.getElementById('qrUrl').textContent = guestUrl();
  startRemote();
}
let remoteLastId = 0, remoteTimer = null;
async function startRemote() {
  if (!SB_ON || remoteTimer) return;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/gubi_feed?room=eq.${roomCode()}&order=id.desc&limit=1&select=id`, { headers: SB_HEADERS });
    const rows = await r.json();
    remoteLastId = rows.length ? rows[0].id : 0;
  } catch (e) {}
  remoteTimer = setInterval(pollRemote, 3000);
}
async function pollRemote() {
  try {
    const r = await fetch(`${SB_URL}/rest/v1/gubi_feed?room=eq.${roomCode()}&id=gt.${remoteLastId}&order=id.asc&select=*&limit=30`, { headers: SB_HEADERS });
    if (!r.ok) return;
    const rows = await r.json();
    for (const row of rows) {
      remoteLastId = Math.max(remoteLastId, row.id);
      const person = String(row.person || '').replace(/[<>"'`]/g, '').slice(0, 20);
      const body = String(row.body || '').replace(/[<>`]/g, '').slice(0, 100);
      if (!person) continue;
      if (row.kind === 'drink' && DRINKS[row.drink]) {
        if (!S().people.includes(person)) S().people.push(person);
        tap(person, { clientX: innerWidth / 2, clientY: innerHeight * 0.35 }, row.amt || 1, row.drink);
        danmaku(`${DRINKS[row.drink].icon} ${person}`);
      } else if (row.kind === 'undo') {
        // その人の最後の記録だけ取り消す（他人の分は消せない）
        for (let i = S().events.length - 1; i >= 0; i--) {
          if (S().events[i].person === person) {
            S().events.splice(i, 1);
            SFX.undo();
            danmaku(`↩︎ ${person} 取り消し`);
            save(); render();
            break;
          }
        }
      } else if (row.kind === 'comment' && body) {
        danmaku(`💬 ${person}: ${body}`, true);
        S().comments.push({ t: Date.now(), person, text: body });
        save(); render();
      }
    }
  } catch (e) {}
}
// ---- ゲスト（スマホリモコン）モード ----
function initGuest() {
  document.title = 'GG グビロワイヤル 📱';
  let saved = '';
  try { saved = (localStorage.getItem('gubi-guest-name') || '').replace(/["<>'`]/g, ''); } catch (e) {}
  document.body.innerHTML = `
    <div class="gWrap">
      <h1 style="color:var(--amber);font-size:22px;text-align:center">🍻 GG グビロワイヤル 📱</h1>
      <div class="hint" style="text-align:center;margin:0">ルーム: ${(GUEST_ROOM || '').replace(/[<>"'`]/g, '')}　飲んだらタップ→iPadで実況！</div>
      <input id="gName" placeholder="なまえ / Name" value="${saved}">
      <div class="hint" style="text-align:center;margin:0">タップ＝1杯　長押し＝半杯½</div>
      <div class="gGrid">${Object.keys(DRINKS).map(k =>
        `<button class="gBtn" onpointerdown="gPress('${k}')" onpointerup="gRelease()" onpointerleave="gRelease()"
          onclick="gDrink('${k}')">${DRINKS[k].icon}<span>${DRINKS[k].label} / ${DRINKS[k].en}</span></button>`).join('')}
      </div>
      <div class="commentRow">
        <input id="gComment" placeholder="コメント → iPadに弾幕で流れる">
        <button onclick="gComment()">送信</button>
      </div>
      <button class="gBtn" style="flex-direction:row;font-size:18px;padding:12px" onclick="gUndo()">↩︎ 1つ戻す（自分の分だけ）</button>
      <div id="gStatus" class="hint" style="text-align:center;min-height:1.2em;margin:0"></div>
    </div>`;
}
async function gSend(payload) {
  const st = document.getElementById('gStatus');
  try {
    const r = await fetch(SB_URL + '/rest/v1/gubi_feed', { method: 'POST', headers: SB_HEADERS, body: JSON.stringify(payload) });
    st.textContent = r.ok ? '✅ iPadに届いた！' : '⚠️ 送信失敗 (' + r.status + ')';
  } catch (e) { st.textContent = '⚠️ 電波チェック！'; }
  setTimeout(() => { st.textContent = ''; }, 2500);
}
function gGetName() {
  const n = (document.getElementById('gName').value || '').trim().slice(0, 20);
  if (n) try { localStorage.setItem('gubi-guest-name', n); } catch (e) {}
  return n;
}
let gTimer = null, gLong = false;
function gPress(k) {
  gLong = false;
  gTimer = setTimeout(() => { gLong = true; gSendDrink(k, 0.5); }, 500);
}
function gRelease() { clearTimeout(gTimer); }
function gDrink(k) {
  if (gLong) { gLong = false; return; } // 長押し済みならclickは無視
  gSendDrink(k, 1);
}
function gSendDrink(k, amt) {
  const n = gGetName(); if (!n) { alert('先に名前を入れてね'); return; }
  playSound(k);
  gSend({ room: GUEST_ROOM, person: n, kind: 'drink', drink: k, amt });
}
function gUndo() {
  const n = gGetName(); if (!n) { alert('先に名前を入れてね'); return; }
  SFX.undo();
  gSend({ room: GUEST_ROOM, person: n, kind: 'undo' });
}
function gComment() {
  const n = gGetName(); if (!n) { alert('先に名前を入れてね'); return; }
  const el = document.getElementById('gComment');
  const text = el.value.trim(); if (!text) return;
  el.value = ''; SFX.click();
  gSend({ room: GUEST_ROOM, person: n, kind: 'comment', body: text.slice(0, 100) });
}

// 画面を常時オンに保つ（Screen Wake Lock・Safari 16.4+）。タップ等の操作で取得、復帰時に再取得
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* 非対応・省電力モードでは黙って諦める */ }
}
document.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

if (GUEST_ROOM) {
  initGuest(); // 📱 スマホリモコンモード
} else {
  applyStatic();
  buildSettings();
  render();
  if (SB_ON && store.settings.room) startRemote(); // リロード後もポーリング再開
}
</script>
